# Step 2 vegetation exploration SA — all veg params together (N=25).
# Params: nmax, krb(0/1/2), cfall(0/1/2), nfall(0/1/2) per active PFT.
# cmax is fixed from Step 1 (not sampled).
# First SA after seed_setup. Analyze/apply: --phase veg_exploration
# Use targeted templates (krb/cfall/nfall) for troublesome PFTs after review.
# See calibration_instructions.md

seed_path: {{SEED_PATH}}
observations: /work/calibration

N_samples: 25

work_dir: {{WORK_DIR}}

params: {{PARAMS_LIST}}
pftnums: {{PFTNUMS_LIST}}
percent_diffs: {{PERCENT_DIFFS}}
# or p_bounds from propose_bounds.py --family veg_exploration

site: {{SITE}}
PXx: {{PXX}}
PXy: {{PXY}}

calib_mode: VEGC
sampling_method: lhc

target_names:
- VegCarbon
- NPPAll
- VegStructuralNitrogen
- AvailableNitrogenSum

aux_outputs:
- INGPP y
- GPP y

cmtnum: {{CMTNUM}}

opt_run_setup: --pr-yrs 100 --eq-yrs 2000 --sp-yrs 0 --tr-yrs 0 --sc-yrs 0
