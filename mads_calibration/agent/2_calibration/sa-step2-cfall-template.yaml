# Step 2 Cfall SA — cfall(0/1/2) -> VEGC. Targeted SA within vegetation phase.
# Analyze: --phase cfall  |  Apply: --phase cfall
# N_samples: 25 (default for Step 2 iteration). See calibration_instructions.md

seed_path: {{SEED_PATH}}
observations: /work/calibration

N_samples: 25

work_dir: {{WORK_DIR}}

# cfall(0/1/2) per active PFT — propose_bounds.py --family cfall
params: {{PARAMS_LIST}}
pftnums: {{PFTNUMS_LIST}}
percent_diffs: {{PERCENT_DIFFS}}
# p_bounds: [[0.0, 0.2], ...]

site: {{SITE}}
PXx: {{PXX}}
PXy: {{PXY}}

calib_mode: VEGC
sampling_method: lhc

target_names:
- VegCarbon
- NPPAll

aux_outputs:
- INGPP y
- GPP y

cmtnum: {{CMTNUM}}

opt_run_setup: --pr-yrs 100 --eq-yrs 2000 --sp-yrs 0 --tr-yrs 0 --sc-yrs 0
